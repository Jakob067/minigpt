[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt"
version = "0.1.0"
description = "A readable decoder-only Transformer built from PyTorch primitives"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.2", "numpy>=1.26", "matplotlib>=3.8", "tqdm>=4.66", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
minigpt-train = "minigpt.train:main"
minigpt-generate = "minigpt.generate:main"
minigpt-eval = "minigpt.evaluate:main"
minigpt-ablate = "minigpt.ablate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
